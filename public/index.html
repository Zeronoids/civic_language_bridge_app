<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Civic Bridge - Dialogue & Live Verification</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 680px; margin: 20px auto; padding: 0 16px; background-color: #f8fafc; color: #0f172a; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    h2 { margin: 0 0 4px 0; }
    p.subtitle { color: #64748b; margin: 0; font-size: 14px; }
    .summary-btn { background: #0f172a; color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .summary-btn:hover { background: #334155; }
    #messages { list-style-type: none; padding: 0; min-height: 380px; max-height: 480px; overflow-y: auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 14px; }
    .message-card { background: #f1f5f9; padding: 14px; border-radius: 8px; border-left: 4px solid #3b82f6; position: relative; }
    .translated-text { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
    .original-text { font-size: 13px; color: #64748b; font-style: italic; margin-bottom: 10px; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; flex-wrap: wrap; gap: 8px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 12px; background: #e0e7ff; color: #3730a3; }
    .actions { display: flex; gap: 6px; }
    .btn-action { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-weight: 500; color: #1e293b; }
    .btn-action:hover { background: #f8fafc; border-color: #94a3b8; }
    .factcheck-box { margin-top: 10px; padding: 10px; border-radius: 6px; background: #fff; border: 1px solid #e2e8f0; font-size: 13px; }
    .status-tag { font-weight: 700; text-transform: uppercase; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .status-Verified { background: #dcfce7; color: #166534; }
    .status-Questionable { background: #fee2e2; color: #991b1b; }
    .status-Needs { background: #fef3c7; color: #92400e; }
    .source-link { display: inline-block; margin-right: 8px; margin-top: 4px; color: #2563eb; text-decoration: none; font-size: 12px; }
    .source-link:hover { text-decoration: underline; }
    form { display: flex; gap: 8px; }
    input { flex-grow: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    button[type="submit"] { padding: 12px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; }
    /* Modal for Summary */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; padding: 16px; }
    .modal-content { background: #fff; max-width: 600px; width: 100%; border-radius: 8px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-height: 80vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h2>Civic Bridge</h2>
      <p class="subtitle">Real-time civic mediation, tone projection & live source RAG</p>
    </div>
    <button class="summary-btn" onclick="openSummary()">⚖️ Summarize Discourse</button>
  </div>
  
  <ul id="messages"></ul>

  <form id="chat-form">
    <input id="message-input" autocomplete="off" placeholder="Type a perspective or claim in any language..." />
    <button type="submit">Send</button>
  </form>

  <!-- Summary Modal -->
  <div id="summary-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin: 0;">Unbiased Discourse Summary</h3>
        <button onclick="closeSummary()" style="cursor: pointer; border: none; background: none; font-size: 18px;">✕</button>
      </div>
      <div id="summary-body" style="white-space: pre-wrap; line-height: 1.5; font-size: 14px; color: #334155;">Loading...</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const messages = document.getElementById('messages');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim()) {
        socket.emit('chat message', input.value.trim());
        input.value = '';
      }
    });

    socket.on('chat message', (data) => {
      const card = document.createElement('li');
      card.className = 'message-card';
      
      card.innerHTML = `
        <div class="translated-text">${data.translated}</div>
        <div class="original-text">Original: "${data.original}"</div>
        <div class="card-footer">
          <span class="badge">${data.emoji} ${data.tone}</span>
          <div class="actions">
            <button class="btn-action" onclick="verifyClaim('${encodeURIComponent(data.translated)}', this)">
              🔍 Check Evidence
            </button>
            <button class="btn-action" onclick="playAudio('${encodeURIComponent(data.translated)}', '${encodeURIComponent(data.tone)}', this)">
              🔊 Listen
            </button>
          </div>
        </div>
        <div class="factcheck-box" style="display: none;"></div>
      `;
      
      messages.appendChild(card);
      messages.scrollTop = messages.scrollHeight;
    });

    async function verifyClaim(encodedText, btn) {
      const claim = decodeURIComponent(encodedText);
      const box = btn.closest('.message-card').querySelector('.factcheck-box');
      
      btn.disabled = true;
      btn.innerText = '🔍 Checking Web...';
      box.style.display = 'block';
      box.innerHTML = '<em>Searching web sources and verifying evidence...</em>';

      try {
        const res = await fetch('/api/factcheck', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ claim })
        });
        const data = await res.json();
        
        const statusClass = 'status-' + (data.status || 'Needs').split(' ')[0];
        let sourcesHtml = (data.sources || []).map(s => 
          `<a class="source-link" href="${s.url}" target="_blank" rel="noopener">🔗 ${s.title || 'Source'}</a>`
        ).join('');

        box.innerHTML = `
          <div style="margin-bottom: 6px;">
            <span class="status-tag ${statusClass}">${data.status}</span>
            <span style="margin-left: 6px;">${data.explanation}</span>
          </div>
          <div>${sourcesHtml}</div>
        `;
      } catch (err) {
        box.innerHTML = '<span style="color: red;">Failed to verify sources.</span>';
      } finally {
        btn.disabled = false;
        btn.innerText = '🔍 Check Evidence';
      }
    }

    async function openSummary() {
      const modal = document.getElementById('summary-modal');
      const body = document.getElementById('summary-body');
      modal.style.display = 'flex';
      body.innerText = 'Generating neutral perspective synthesis...';

      try {
        const res = await fetch('/api/summarize');
        const data = await res.json();
        body.innerText = data.summary;
      } catch (err) {
        body.innerText = 'Error generating discourse summary.';
      }
    }

    function closeSummary() {
      document.getElementById('summary-modal').style.display = 'none';
    }

    async function playAudio(encodedText, encodedTone, btn) {
      const text = decodeURIComponent(encodedText);
      const tone = decodeURIComponent(encodedTone);
      const originalLabel = btn.innerText;

      btn.disabled = true;
      btn.innerText = '⏳ Synthesizing...';

      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, tone })
        });

        if (!res.ok) throw new Error('Audio generation failed');

        const blob = await res.blob();
        const audioUrl = URL.createObjectURL(blob);
        const audio = new Audio(audioUrl);
        
        audio.onended = () => {
          btn.disabled = false;
          btn.innerText = originalLabel;
        };

        await audio.play();
        btn.innerText = '▶ Playing...';
      } catch (err) {
        console.error('Audio play error:', err);
        btn.disabled = false;
        btn.innerText = '❌ Failed';
        setTimeout(() => { btn.innerText = originalLabel; }, 2000);
      }
    }
  </script>
</body>
</html>
